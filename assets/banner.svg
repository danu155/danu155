<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="DANU155 - Nothing is true, everything is permitted">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#14070B"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C1121F" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#C1121F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="emblemFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3B4E"/>
      <stop offset="1" stop-color="#6E0910"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C1121F"/>
      <stop offset="1" stop-color="#C1121F" stop-opacity="0"/>
    </linearGradient>

    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#C1121F" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <g id="creed">
      <path d="M50 2 L96 122 L70 122 L50 66 L30 122 L4 122 Z"/>
      <path d="M50 66 L64 114 L50 150 L36 114 Z"/>
    </g>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#hatch)"/>

  <g opacity="0.9">
    <ellipse cx="160" cy="160" rx="270" ry="210" fill="url(#glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g transform="translate(1000 36) scale(1.55)" fill="url(#emblemFill)" opacity="0.13">
    <use href="#creed"/>
  </g>

  <g transform="translate(96 68) scale(1.22)" fill="url(#emblemFill)">
    <use href="#creed"/>
  </g>

  <line x1="0" y1="0" x2="1200" y2="0" stroke="#C1121F" stroke-opacity="0.55" stroke-width="2"/>

  <text x="268" y="146" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="9" fill="#F7F7F7">DANU155</text>

  <line x1="272" y1="176" x2="880" y2="176" stroke="url(#rule)" stroke-width="2"/>

  <text x="270" y="212" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4.2" fill="#C1121F">NOTHING IS TRUE &#183; EVERYTHING IS PERMITTED</text>

  <text x="270" y="252" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.6" fill="#8A8A8A">PENETRATION TESTING &#183; CTF PLAYER &#183; NETWORK SECURITY</text>

  <line x1="0" y1="318" x2="1200" y2="318" stroke="#C1121F" stroke-opacity="0.55" stroke-width="2"/>
</svg>
