<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none" role="img" aria-label="danu155 — Network and Cyber Security">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090C"/>
      <stop offset="0.5" stop-color="#0C0E13"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#0EA5E9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#6D28D9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>

    <!-- glass surface: from-white/[0.07] via-white/[0.02] to-white/[0.05] -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.022"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.055"/>
    </linearGradient>

    <!-- top sheen: from-white/[0.06] via-transparent -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.065"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- border: border-border/50 → subtle light rim -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- shadow-[0_25px_60px_rgba(0,0,0,0.6)] -->
    <filter id="cardShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="blurHeavy" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="avatarClip"><circle cx="126" cy="200" r="52"/></clipPath>
    <clipPath id="cardClip"><rect x="24" y="24" width="1152" height="382" rx="28"/></clipPath>
  </defs>

  <!-- ===== canvas ===== -->
  <rect width="1200" height="430" fill="url(#bgBase)"/>

  <!-- ambient glows -->
  <g filter="url(#blurHeavy)">
    <ellipse cx="150" cy="60" rx="330" ry="230" fill="url(#glowCyan)"/>
    <ellipse cx="1060" cy="380" rx="340" ry="240" fill="url(#glowViolet)"/>
  </g>

  <!-- ===== glass card ===== -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="24" width="1152" height="382" rx="28" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.2"/>
  </g>

  <g clip-path="url(#cardClip)">
    <!-- top sheen -->
    <path d="M24 52 a28 28 0 0 1 28 -28 h1096 a28 28 0 0 1 28 28 v52 H24 z" fill="url(#sheen)"/>
    <!-- primary glow behind avatar (from-primary/15 blur-3xl) -->
    <ellipse cx="130" cy="200" rx="150" ry="120" fill="#38BDF8" opacity="0.16" filter="url(#blurHeavy)"/>
  </g>

  <!-- ===== avatar ===== -->
  <circle cx="126" cy="200" r="58" fill="#0B0D12" opacity="0.9"/>
  <circle cx="126" cy="200" r="56" fill="none" stroke="url(#ring)" stroke-width="1.8" opacity="0.85"/>
  <image href="https://avatars.githubusercontent.com/u/186253953?v=4" x="74" y="148" width="104" height="104" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- status pill under avatar -->
  <rect x="76" y="268" width="100" height="26" rx="13" fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.40" stroke-width="1"/>
  <circle cx="93" cy="281" r="3.5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="104" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#4ADE80">ONLINE</text>

  <!-- ===== name block ===== -->
  <text x="218" y="132" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5" fill="url(#nameGrad)">danu155</text>

  <text x="220" y="160" font-family="Consolas, Menlo, monospace" font-size="13.5" letter-spacing="0.4" fill="#7DD3FC" opacity="0.9">Network &amp; Cyber Security · SIJA SMKN 7 Semarang</text>

  <!-- subtle divider -->
  <line x1="220" y1="178" x2="600" y2="178" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

  <!-- ===== highlight rows (glass cards, like 21st highlight items) ===== -->
  <g>
    <!-- row 1 -->
    <rect x="220" y="194" width="404" height="46" rx="14" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="242" cy="217" r="4" fill="#38BDF8"/>
    <text x="258" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#94A3B8">MISSION</text>
    <text x="258" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#E2E8F0">Become a Penetration Tester</text>

    <!-- row 2 -->
    <rect x="220" y="248" width="404" height="46" rx="14" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="242" cy="271" r="4" fill="#8B5CF6"/>
    <text x="258" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#94A3B8">FOCUS</text>
    <text x="258" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#E2E8F0">Pentesting · CTF · Network Security</text>

    <!-- row 3 -->
    <rect x="220" y="302" width="404" height="46" rx="14" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="242" cy="325" r="4" fill="#22C55E"/>
    <text x="258" y="321" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#94A3B8">CREED</text>
    <text x="258" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#E2E8F0">Learn. Hack. Defend.</text>
  </g>

  <!-- ===== right column: stat tiles ===== -->
  <g>
    <!-- tile A -->
    <rect x="664" y="194" width="236" height="72" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
    <text x="688" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#64748B">REPOSITORIES</text>
    <text x="688" y="252" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="700" fill="#E2E8F0" filter="url(#glowSoft)">08</text>
    <rect x="742" y="236" width="34" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="742" y="236" width="34" height="4" rx="2" fill="url(#barGrad)"/>

    <!-- tile B -->
    <rect x="916" y="194" width="236" height="72" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
    <text x="940" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#64748B">COMMITS</text>
    <text x="940" y="252" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="700" fill="#E2E8F0" filter="url(#glowSoft)">20</text>
    <rect x="994" y="236" width="34" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="994" y="236" width="26" height="4" rx="2" fill="url(#barGrad)"/>

    <!-- tile C: terminal -->
    <rect x="664" y="280" width="488" height="68" rx="16" fill="#0A0C11" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <text x="688" y="306" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#22C55E">danu@kali</text>
    <text x="770" y="306" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#64748B">:~$</text>
    <text x="800" y="306" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#CBD5E1">sudo apt install success</text>
    <rect x="984" y="295" width="7" height="13" fill="#22C55E">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <text x="688" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">Open to internship · PKL · collaboration</text>

    <!-- small social dots -->
    <g opacity="0.85">
      <circle cx="1064" cy="322" r="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
      <circle cx="1098" cy="322" r="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
      <circle cx="1132" cy="322" r="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
      <!-- mail glyph -->
      <path d="M1058 317 h12 v10 h-12 z" fill="none" stroke="#7DD3FC" stroke-width="1.3"/>
      <path d="M1058 317 l6 5 l6 -5" fill="none" stroke="#7DD3FC" stroke-width="1.3"/>
      <!-- code glyph -->
      <path d="M1093 317 l-4 5 l4 5 M1103 317 l4 5 l-4 5" fill="none" stroke="#A5B4FC" stroke-width="1.3" stroke-linecap="round"/>
      <!-- link glyph -->
      <path d="M1128 322 a4 4 0 0 1 4 -4 h3 M1136 327 a4 4 0 0 1 -4 4 h-3" fill="none" stroke="#C4B5FD" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- top-left corner accent -->
  <path d="M26 96 V56 a28 28 0 0 1 28 -28 h44" fill="none" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
  <!-- bottom-right corner accent -->
  <path d="M1174 334 v40 a28 28 0 0 1 -28 28 h-44" fill="none" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
</svg>
